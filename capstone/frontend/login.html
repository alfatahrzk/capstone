<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ontime LMS - Masuk ke Portal Belajar</title>
    <meta name="description"
        content="Login ke Ontime LMS - Platform pembelajaran modern untuk akselerasi kompetensi talenta.">
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>
    <!-- Main Container Card -->
    <main class="login-card" id="loginCard">
        <!-- Left Branding & Illustration Section -->
        <section class="brand-section">
            <!-- Top Branding -->
            <div class="brand-top">
                <!-- Logo -->
                <div class="logo-group">
                    <div class="logo-circle">
                        <span class="logo-bar"></span>
                    </div>
                    <span class="logo-text">Ontime<span class="logo-dot">.</span></span>
                </div>
                <!-- Headline -->
                <div class="brand-headline">
                    <h1>
                        Unlock Your <br>
                        <span class="headline-accent">Team Performance</span>
                    </h1>
                    <p class="brand-desc">
                        Akselerasi proses pembelajaran dan tingkatkan kompetensi talenta dengan LMS modern yang
                        terstruktur.
                    </p>
                </div>
            </div>

            <!-- Hero Illustration -->
            <div class="hero-illustration">
                <!-- Decorative Arch -->
                <div class="illustration-arch"></div>
                <svg class="illustration-svg" fill="none" viewBox="0 0 520 460" xmlns="http://www.w3.org/2000/svg"
                    aria-hidden="true">
                    <!-- Background subtle grid lines -->
                    <line stroke="#bfe5df" stroke-dasharray="4 4" stroke-width="1.5" x1="260" x2="260" y1="60" y2="430">
                    </line>
                    <line stroke="#bfe5df" stroke-dasharray="4 4" stroke-width="1.5" x1="160" x2="360" y1="210"
                        y2="210"></line>

                    <!-- CHARACTER 1: Yellow/Orange Shirt & Teal Trousers -->
                    <g id="char1">
                        <path d="M125 240 L115 390 L155 390 L162 270 Z" fill="#008b82"></path>
                        <path d="M165 240 L160 390 L195 390 L190 270 Z" fill="#008b82"></path>
                        <rect fill="#a4dfd9" height="5" width="40" x="115" y="380"></rect>
                        <rect fill="#a4dfd9" height="5" width="35" x="160" y="380"></rect>
                        <path d="M98 410 C105 400 115 390 125 390 L155 390 C155 405 140 410 98 410 Z" fill="#111827">
                        </path>
                        <path d="M160 390 L195 390 C195 402 210 410 220 410 L160 410 Z" fill="#111827"></path>
                        <path d="M130 185 C145 180 180 178 200 190 L195 245 C175 252 145 250 130 242 Z" fill="#f59e0b">
                        </path>
                        <path d="M142 190 Q150 215 145 240" stroke="#d97706" stroke-width="1.5"></path>
                        <path d="M175 190 Q168 220 185 245" stroke="#d97706" stroke-width="1.5"></path>
                        <path d="M160 170 L170 170 L170 185 L160 185 Z" fill="#fbcfe8"></path>
                        <ellipse cx="165" cy="160" fill="#fed7aa" rx="11" ry="14"></ellipse>
                        <path d="M154 156 C155 146 175 144 176 156 C176 160 170 152 165 152 C160 152 155 160 154 156 Z"
                            fill="#991b1b"></path>
                    </g>

                    <!-- CHARACTER 2: Blue Pattern Sweater & Navy Trousers -->
                    <g id="char2">
                        <path d="M200 260 L188 385 L220 385 L225 285 Z" fill="#1e293b"></path>
                        <path d="M228 260 L230 385 L260 385 L252 285 Z" fill="#1e293b"></path>
                        <path d="M194 290 Q205 310 195 340" stroke="#475569" stroke-width="2"></path>
                        <path d="M236 300 Q248 330 238 360" stroke="#475569" stroke-width="2"></path>
                        <rect fill="#facc15" height="15" width="28" x="190" y="385"></rect>
                        <rect fill="#facc15" height="15" width="25" x="233" y="385"></rect>
                        <path d="M175 410 L218 410 L218 400 L175 400 Z" fill="#111827"></path>
                        <path d="M233 400 L270 400 L270 410 L233 410 Z" fill="#111827"></path>
                        <path d="M190 200 C205 195 240 195 255 200 L250 265 C230 272 205 270 190 262 Z" fill="#2563eb">
                        </path>
                        <circle cx="205" cy="215" fill="#ffffff" r="3"></circle>
                        <circle cx="230" cy="210" fill="#ffffff" r="2.5"></circle>
                        <circle cx="220" cy="235" fill="#ffffff" r="3"></circle>
                        <circle cx="242" cy="245" fill="#ffffff" r="2.5"></circle>
                        <circle cx="205" cy="250" fill="#ffffff" r="3"></circle>
                        <path d="M188 220 Q225 245 255 220" stroke="#1d4ed8" stroke-linecap="round" stroke-width="6">
                        </path>
                        <ellipse cx="225" cy="175" fill="#fed7aa" rx="10" ry="13"></ellipse>
                        <path d="M214 175 C215 158 238 158 238 175 C238 185 230 180 225 180 C219 180 214 185 214 175 Z"
                            fill="#7f1d1d"></path>
                    </g>

                    <!-- CHARACTER 3: Turquoise Top & Mustard Culottes -->
                    <g id="char3">
                        <path d="M272 250 L258 365 L292 365 L295 270 Z" fill="#f59e0b"></path>
                        <path d="M298 250 L300 365 L335 365 L320 270 Z" fill="#f59e0b"></path>
                        <path d="M272 290 Q280 300 276 320" stroke="#d97706" stroke-width="2"></path>
                        <path d="M308 300 Q320 315 315 335" stroke="#d97706" stroke-width="2"></path>
                        <rect fill="#fed7aa" height="35" width="16" x="270" y="365"></rect>
                        <rect fill="#fed7aa" height="35" width="16" x="306" y="365"></rect>
                        <rect fill="#3b82f6" height="15" width="16" x="270" y="390"></rect>
                        <path d="M250 410 L286 410 L286 402 L250 405 Z" fill="#eab308"></path>
                        <path d="M306 405 L340 405 L340 410 L306 410 Z" fill="#eab308"></path>
                        <path d="M265 200 C280 195 320 195 335 200 L330 255 C310 258 285 258 268 252 Z" fill="#0d9488">
                        </path>
                        <ellipse cx="300" cy="180" fill="#fed7aa" rx="9" ry="12"></ellipse>
                        <path d="M292 178 C294 165 310 165 311 178 C311 184 300 183 292 178 Z" fill="#991b1b"></path>
                    </g>

                    <!-- CHARACTER 4: Dark Tee & Royal Blue Trousers -->
                    <g id="char4">
                        <path d="M340 245 L335 380 L370 380 L368 265 Z" fill="#3b82f6"></path>
                        <path d="M375 245 L372 380 L415 380 L395 265 Z" fill="#3b82f6"></path>
                        <rect fill="#2563eb" height="18" width="25" x="335" y="380"></rect>
                        <rect fill="#111827" height="18" width="22" x="378" y="380"></rect>
                        <path d="M325 410 L362 410 L362 398 L325 402 Z" fill="#111827"></path>
                        <path d="M378 398 L430 402 L430 410 L378 410 Z" fill="#111827"></path>
                        <path d="M335 180 C360 175 400 175 415 180 L410 245 C385 250 355 250 338 245 Z" fill="#0f172a">
                        </path>
                        <ellipse cx="372" cy="158" fill="#fed7aa" rx="10" ry="13"></ellipse>
                        <circle cx="369" cy="158" fill="none" r="3" stroke="#b45309" stroke-width="1.5"></circle>
                        <circle cx="376" cy="158" fill="none" r="3" stroke="#b45309" stroke-width="1.5"></circle>
                        <line stroke="#b45309" stroke-width="1" x1="372" x2="373" y1="158" y2="158"></line>
                        <path d="M363 154 C364 145 382 145 383 154 C380 150 367 150 363 154 Z" fill="#78350f"></path>
                    </g>
                </svg>
            </div>

        </section>

        <!-- Right Login Form Section -->
        <section class="form-section">
            <!-- Top Form Header -->
            <div class="form-content">
                <header class="form-header">
                    <h2>Welcome to Ontime</h2>
                    <p>Unlock Your Team Performance</p>
                </header>

                <!-- Role Toggle Selector -->
                <div class="role-selector-wrapper">
                    <div class="role-selector" id="roleSelector">
                        <div class="role-option">
                            <input type="radio" class="role-radio" id="role-siswa" name="role" value="siswa" checked>
                            <label for="role-siswa">Siswa / Mhs</label>
                        </div>
                        <div class="role-option">
                            <input type="radio" class="role-radio" id="role-instruktur" name="role" value="instruktur">
                            <label for="role-instruktur">Instruktur</label>
                        </div>
                        <div class="role-option">
                            <input type="radio" class="role-radio" id="role-admin" name="role" value="admin">
                            <label for="role-admin">Admin</label>
                        </div>
                    </div>
                </div>

                <!-- Login Form -->
                <form id="loginForm" class="login-form" method="POST" novalidate>
                    <!-- Email Input -->
                    <div class="form-group">
                        <label class="form-label" for="email">Email address</label>
                        <div class="input-wrapper">
                            <input type="email" id="email" name="email" class="form-input" placeholder="Email" required
                                autocomplete="email">
                        </div>
                    </div>

                    <!-- Password Input -->
                    <div class="form-group">
                        <div class="label-row">
                            <label class="form-label" for="password">Password</label>
                        </div>
                        <div class="input-wrapper input-with-toggle">
                            <input type="password" id="password" name="password" class="form-input"
                                placeholder="Enter password" required autocomplete="current-password">
                            <button type="button" class="toggle-password" id="togglePassword"
                                aria-label="Toggle Password Visibility">
                                <svg class="eye-icon" id="eyeIcon" width="20" height="20" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor">
                                    <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round"
                                        stroke-linejoin="round" stroke-width="1.8"></path>
                                    <path
                                        d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                                        stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Remember Me & Forgot Password -->
                    <div class="form-options">
                        <label class="checkbox-label">
                            <input type="checkbox" id="rememberMe" class="form-checkbox">
                            <span>Ingat saya</span>
                        </label>
                        <a href="#forgot" class="forgot-link">Forgot password?</a>
                    </div>

                    <!-- Error Message -->
                    <div id="errorMessage" class="error-message hidden"></div>

                    <!-- Submit Button -->
                    <div class="submit-wrapper">
                        <button type="submit" class="btn-primary" id="loginButton">
                            <span class="btn-text">Login</span>
                            <span class="btn-loader hidden" id="btnLoader">
                                <svg class="spinner" width="20" height="20" viewBox="0 0 24 24" fill="none">
                                    <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"
                                        stroke-linecap="round" stroke-dasharray="31.4 31.4" opacity="0.3"></circle>
                                    <path d="M12 2a10 10 0 010 20" stroke="currentColor" stroke-width="3"
                                        stroke-linecap="round"></path>
                                </svg>
                            </span>
                        </button>
                    </div>

                    <!-- Register Prompt -->
                    <div class="register-prompt">
                        <p>Don't have an account? <a href="#register" class="register-link">Register</a></p>
                    </div>
                </form>
            </div>

            <!-- Bottom Copyright -->
            <footer class="login-footer">
                <p>&copy;2024 Ontime LMS. All rights reserved.</p>
            </footer>
        </section>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
